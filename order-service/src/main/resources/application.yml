server:
  port: 8083

spring:
  cloud:
    compatibility-verifier:
      enabled: false

  config:
    # 로컬 실행 시 루트 .env를 읽는다 (컨테이너/CI에서는 파일이 없으므로 무시됨)
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: ecommerce
    password: ${DB_PASSWORD:ecommerce1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092

jwt:
  secret: ${JWT_SECRET}

toss:
  secret-key: ${TOSS_SECRET_KEY}
