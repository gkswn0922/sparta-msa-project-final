server:
  port: 8081

spring:
  config:
    # 로컬 실행 시 루트 .env를 읽는다 (컨테이너/CI에서는 파일이 없으므로 무시됨)
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: ecommerce
    password: ${DB_PASSWORD:ecommerce1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000    # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)
