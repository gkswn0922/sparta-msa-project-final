plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
	group = 'com.example'
	version = '0.0.1-SNAPSHOT'
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'
	apply plugin: 'jacoco'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	repositories {
		mavenCentral()
	}

	dependencies {
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	dependencyManagement {
		imports {
			mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2024.0.1'
		}
	}

	jacoco {
		toolVersion = '0.8.13'
	}

	tasks.named('test') {
		useJUnitPlatform()
		finalizedBy 'jacocoTestReport' // 테스트가 끝나면 커버리지 리포트 생성
	}

	tasks.named('jacocoTestReport') {
		dependsOn 'test'
		reports {
			html.required = true // 사람이 보는 용도: build/reports/jacoco/test/html/index.html
			xml.required = true  // CI 도구가 읽는 용도
		}
		// main() 만 있는 부트스트랩 클래스는 측정 대상에서 제외
		classDirectories.setFrom(sourceSets.main.output.classesDirs.asFileTree.matching {
			exclude '**/*Application*'
		})
	}
}