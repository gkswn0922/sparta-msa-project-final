server:
  port: 8082

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5433/product_db
    username: ecommerce
    password: ecommerce1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: my-super-secret-key-for-jwt-signing-must-be-long-enough-256bits
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000
