server:
  port: 8080

spring:
  config:
    # 로컬 실행 시 루트 .env를 읽는다 (컨테이너/CI에서는 파일이 없으므로 무시됨)
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
          filters:
            - name: AuthFilter
              args:
                excludePaths: /api/users/signup,/api/users/login

        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/products/**
          filters:
            - name: AuthFilter
              args:
                excludePaths: /api/products

        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/api/carts/**,/api/orders/**,/api/coupons/**,/api/payments/**
          filters:
            - name: AuthFilter
              args:
                excludePaths:

        - id: notification-service
          uri: http://notification-service:8084
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: AuthFilter
              args:
                excludePaths:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:8083"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
            allowedHeaders: "*"

    compatibility-verifier:
      enabled: false


jwt:
  secret: ${JWT_SECRET}
