server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
          filters:
            - name: AuthFilter
              args:
                excludePaths: /api/users/signup,/api/users/login

        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/products/**
          filters:
            - name: AuthFilter
              args:
                excludePaths: /api/products

        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/api/carts/**,/api/orders/**,/api/coupons/**,/api/payments/**
          filters:
            - name: AuthFilter
              args:
                excludePaths:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:8083"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
            allowedHeaders: "*"

    compatibility-verifier:
      enabled: false


jwt:
  secret: my-super-secret-key-for-jwt-signing-must-be-long-enough-256bits